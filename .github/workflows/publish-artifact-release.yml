name: Publish existing artifact as Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave empty to generate one)"
        required: false
        type: string
      release_name:
        description: "Release title"
        required: false
        default: "KitKat Browser build"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: "11926072622"
        run: |
          set -euo pipefail
          mkdir -p downloaded release-assets
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > downloaded/artifact.zip
          if ! unzip -tq downloaded/artifact.zip >/dev/null; then
            echo "::error::The artifact download is not a valid ZIP. It may have expired or be inaccessible."
            exit 1
          fi
          unzip -q downloaded/artifact.zip -d downloaded/content
          find downloaded/content -type f -exec cp --parents '{}' release-assets/ \;
          # Flatten the artifact's internal directory structure when names are unique.
          mkdir -p release-assets-flat
          find downloaded/content -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "release-assets-flat/$(basename "$file")"
          done
          if [ -z "$(find release-assets-flat -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::The artifact contains no files."
            exit 1
          fi
          # Use the flattened files as Release assets.
          rm -rf release-assets
          mv release-assets-flat release-assets
          echo "Files to publish:"
          find release-assets -maxdepth 1 -type f -printf '%f (%s bytes)\n'

      - name: Create GitHub Release and upload files
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="kitkat-browser-build-$RUN_NUMBER"
          fi
          gh release create "$TAG" release-assets/* \
            --title "$RELEASE_NAME" \
            --notes "Published from Actions artifact ID 11926072622 (source run 38629946593)." \
            --verify-tag=false
          echo "Release published: $TAG"
