name: Gecko API 19 compatibility audit

on:
  workflow_dispatch:
    inputs:
      gecko_ref:
        description: "Mozilla gecko-dev tag or branch to inspect"
        required: true
        default: "FIREFOX_128_0_RELEASE"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Fetch GeckoView Gradle configuration
        env:
          GECKO_REF: ${{ inputs.gecko_ref }}
        run: |
          set -euo pipefail
          URL="https://raw.githubusercontent.com/mozilla/gecko-dev/${GECKO_REF}/mobile/android/geckoview/build.gradle"
          echo "Inspecting: ${URL}"
          curl --fail --location --silent --show-error "${URL}" -o geckoview-build.gradle
          echo
          echo "=== Android SDK / NDK / toolchain references ==="
          grep -nEi 'minSdk|min.sdk|compileSdk|targetSdk|ndkVersion|ndkVersion|abiFilters|desugar|kotlin' geckoview-build.gradle || true
          echo
          echo "=== Relevant Gradle configuration (first 240 lines) ==="
          sed -n '1,240p' geckoview-build.gradle
          echo
          echo "=== API 19 preliminary assessment ==="
          if grep -Eq 'minSdkVersion[[:space:]]+19|minSdk[[:space:]]*=[[:space:]]*19' geckoview-build.gradle; then
            echo "The file appears to declare API 19. This is only a preliminary signal, not proof that native Gecko supports KitKat."
          else
            echo "No obvious API 19 minimum was found in this file. Inspect the full dependency/toolchain graph before attempting a build."
          fi
      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gecko-api19-audit
          path: geckoview-build.gradle
          if-no-files-found: warn
          retention-days: 7
